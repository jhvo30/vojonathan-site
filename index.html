<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f8f9fb" />
  <meta name="description" content="Jonathan's personal website." />
  <title>Jonathan Vo</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; background: #f8f9fb; color: #172033; }
    main { min-height: 100svh; display: flex; align-items: center; justify-content: center; padding: 32px 24px; }
    .content { width: min(100%, 680px); }
    .eyebrow { display: inline-flex; align-items: center; gap: 10px; color: #687387; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; font-weight: 650; margin-bottom: 24px; }
    .dot { width: 8px; height: 8px; background: #5474db; border-radius: 50%; }
    h1 { font-size: clamp(3.5rem, 10vw, 6.5rem); line-height: 1.04; letter-spacing: -.075em; margin: 0 0 24px; font-weight: 750; }
    h1 span { color: #5072de; }
    p { margin: 0; color: #647084; font-size: clamp(1.05rem, 2.2vw, 1.25rem); line-height: 1.7; max-width: 450px; }
    .rule { height: 1px; background: #e2e6ed; margin-top: 48px; }
    footer { padding-top: 18px; color: #8b96a7; font-size: 13px; }
    @media (prefers-color-scheme: dark) {
      :root { color-scheme: dark; }
      body { background: #0d111b; color: #f0f3fa; }
      p, .eyebrow { color: #a0abc0; }
      h1 span { color: #8fa7ff; }
      .rule { background: #252d3d; }
      footer { color: #79859b; }
    }
  </style>
</head>
<body>
  <main>
    <div class="content">
      <div class="eyebrow"><span class="dot" aria-hidden="true"></span> Personal website</div>
      <h1>Hey, I'm<br><span>Jonathan.</span></h1>
      <p>Welcome to my little corner of the internet. More coming soon.</p>
      <div class="rule"></div>
      <footer>© <span id="year">2026</span> Jonathan Vo</footer>
    </div>
  </main>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
